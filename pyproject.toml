[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keiraku"
version = "0.1.0"
description = "Attach any AI agent harness to a shared memory source."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "SherlockianAsh" }]
keywords = ["agents", "llm", "ipc", "presence", "claude-code", "codex", "hooks"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

# No runtime dependencies. This is deliberate: a Keiraku vessel must be
# attachable inside any agent harness without dragging a dependency tree
# into it. Everything here is standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/SherlockianAsh/keiraku"

[project.scripts]
keiraku = "keiraku.cli:main"

[tool.setuptools.packages.find]
include = ["keiraku*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
